[package]
name = "instant-ai-context"
version = "0.1.0"
description = "Ultra-lightweight desktop AI context utility"
authors = ["Sonu"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
arboard = "3.6"
dotenvy = "0.15"
keyring = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.0"
tauri-plugin-log = "2.0"
tauri-plugin-opener = "2.0"
tauri-plugin-single-instance = "2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4"
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_System_DataExchange", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
# Additional optimizations for smallest binary
split-debuginfo = "packed"

[profile.dev]
opt-level = 0

# Windows MSVC optimizations
[profile.release.package."*"]
opt-level = "z"
